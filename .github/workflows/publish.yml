name: Build & Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # allow manual trigger for testing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        # ubuntu-latest  = Linux x86_64
        # macos-14       = macOS arm64 (Apple Silicon)

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          # Build for Python 3.11 - 3.13
          CIBW_BUILD: "cp311-* cp312-* cp313-*"

          # Skip 32-bit and musl (Alpine) builds
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"

          # Use manylinux_2_28 (usearch only ships wheels for this platform)
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"

          # Linux: install build tools inside the container
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y binutils cmake gcc-c++ make openblas-devel || true

          # macOS: cmake is pre-installed on GitHub runners
          CIBW_BEFORE_ALL_MACOS: >
            brew install cmake || true

          # Verify the extension loaded after build on every published platform.
          CIBW_TEST_COMMAND: >
            python -c "from tmap.layout._ogdf import _AVAILABLE; assert _AVAILABLE, 'OGDF extension not available'" &&
            python -c "from tmap.layout import layout_from_edge_list; x, y, s, t = layout_from_edge_list(3, [(0, 1, 1.0), (1, 2, 1.0)]); assert len(x) == 3 and len(s) == 2"

          # Linux wheels must not contain EVEX instructions (0x62), which are
          # emitted by AVX-512 and caused SIGILL on older x86_64 CPUs when OGDF
          # was compiled with its default -march=native.
          CIBW_TEST_COMMAND_LINUX: >
            python -c "from tmap.layout._ogdf import _AVAILABLE; assert _AVAILABLE, 'OGDF extension not available'" &&
            python -c "from tmap.layout import layout_from_edge_list; x, y, s, t = layout_from_edge_list(3, [(0, 1, 1.0), (1, 2, 1.0)]); assert len(x) == 3 and len(s) == 2" &&
            python -c "import glob, os, re, subprocess, tmap.layout; p = glob.glob(os.path.join(os.path.dirname(tmap.layout.__file__), '_tmap_ogdf*.so'))[0]; d = subprocess.check_output(['objdump', '-d', p], text=True); assert not re.search(r'^\\s*[0-9a-f]+:\\s+62(?:\\s|$)', d, re.MULTILINE | re.IGNORECASE), f'AVX-512 instruction found in {p}'"

          # macOS arm64 only on macos-14 runner
          CIBW_ARCHS_MACOS: "native"
          CIBW_ARCHS_LINUX: "x86_64"

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # trusted publishing (no API token needed)

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
